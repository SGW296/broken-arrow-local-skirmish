name: Managed lobby checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  managed:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'
      - name: Run managed and temporary-file fixtures
        shell: pwsh
        run: ./scripts/Verify-Lobby.ps1 -ManagedOnly
